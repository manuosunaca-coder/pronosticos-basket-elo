name: Probar fuentes
on:
  workflow_dispatch: {}
  push:
    paths: ["probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe.py > probe_out.txt 2>&1 || true
      - run: |
          git config user.name "pronosticos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe_out.txt
          git commit -m "probe output" || true
          git push
