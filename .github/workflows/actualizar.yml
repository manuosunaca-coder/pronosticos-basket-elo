name: Actualizar pronósticos

on:
  schedule:
    - cron: "23 6 * * *"     # cada día ~07:23/08:23 hora de Madrid
    - cron: "23 15 * * *"    # y ~16:23/17:23
  workflow_dispatch: {}
  push:
    paths: ["predict.py", "elo_core.py", ".github/workflows/actualizar.yml"]

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcular Elo y pronósticos
        run: python predict.py
      - name: Guardar cambios
        run: |
          git config user.name "pronosticos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json history.json cache
          git diff --cached --quiet || git commit -m "Pronósticos $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
